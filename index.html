<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>AR Simulation of Newton's Second Law</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <a-scene
      id="arScene"
      embedded
      renderer="antialias: true; logarithmicDepthBuffer: true;"
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <a-asset-item id="cartModel" src="assets/cart.glb"></a-asset-item>
      </a-assets>

      <a-marker id="hiroMarker" preset="hiro">
        <a-entity id="simulationRoot" position="0 0 0">
          <a-plane
            rotation="-90 0 0"
            width="3.2"
            height="1.4"
            material="color: #101820; opacity: 0.34; transparent: true; side: double"
          ></a-plane>

          <a-entity id="cartRig" position="0 0.16 0">
            <!--
              If the model appears too large or too small, adjust the scale below.
              If the cart faces the wrong direction, change the rotation below.
              Example rotation values: "0 90 0", "0 -90 0", or "0 180 0".
            -->
            <a-entity
              id="cart"
              gltf-model="#cartModel"
              position="0 0 0"
              rotation="0 90 0"
              scale="0.28 0.28 0.28"
            ></a-entity>

            <a-entity id="forceArrow" position="0.38 0.18 0">
              <a-cylinder
                id="forceArrowShaft"
                radius="0.025"
                height="0.45"
                rotation="0 0 -90"
                material="color: #ff5a1f; emissive: #ff5a1f; emissiveIntensity: 0.35"
              ></a-cylinder>
              <a-cone
                id="forceArrowHead"
                radius-bottom="0.075"
                height="0.16"
                rotation="0 0 -90"
                material="color: #ff5a1f; emissive: #ff5a1f; emissiveIntensity: 0.35"
              ></a-cone>
            </a-entity>

            <a-text
              id="cartLabel"
              value="F = 10 N&#10;m = 2 kg&#10;a = 5.00 m/s^2"
              align="center"
              color="#ffffff"
              width="2.2"
              position="0 0.78 0"
              rotation="-55 0 0"
              scale="0.7 0.7 0.7"
            ></a-text>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <main class="ui-overlay" aria-label="Newton's Second Law controls">
      <section class="top-panel">
        <div>
          <p class="eyebrow">AR Simulation</p>
          <h1>Newton's Second Law</h1>
        </div>
        <div class="formula" aria-label="Formula F equals m times a">F = m x a</div>
      </section>

      <section class="readout-panel" aria-live="polite">
        <div class="readout">
          <span>Force</span>
          <strong id="forceOutput">10 N</strong>
        </div>
        <div class="readout">
          <span>Mass</span>
          <strong id="massOutput">2 kg</strong>
        </div>
        <div class="readout accent">
          <span>Acceleration</span>
          <strong id="accelerationOutput">5.00 m/s^2</strong>
        </div>
      </section>

      <p id="markerStatus" class="marker-status">Scan the Hiro marker to view the AR simulation.</p>

      <section class="control-panel">
        <label class="slider-control" for="forceSlider">
          <span class="slider-header">
            <span>Force</span>
            <output id="forceSliderValue">10 N</output>
          </span>
          <input id="forceSlider" type="range" min="1" max="20" value="10" step="1" />
        </label>

        <label class="slider-control" for="massSlider">
          <span class="slider-header">
            <span>Mass</span>
            <output id="massSliderValue">2 kg</output>
          </span>
          <input id="massSlider" type="range" min="1" max="10" value="2" step="1" />
        </label>

        <div class="button-row">
          <button id="playPauseButton" type="button">Pause</button>
          <button id="resetButton" type="button" class="secondary">Reset</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
