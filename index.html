<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Newton's 2nd Law – WebAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js for A-Frame (marker-based) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- ═══════════════════════════════════════════
         A-FRAME AR SCENE
    ════════════════════════════════════════════ -->
    <a-scene
      id="arScene"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; antialias: true;"
      vr-mode-ui="enabled: false"
    >

      <!-- ── Assets ── -->
      <a-assets>
        <!-- Cart body material -->
        <a-mixin id="cart-body"
          geometry="primitive: box; width: 0.6; height: 0.3; depth: 0.35"
          material="color: #2196F3; metalness: 0.3; roughness: 0.6"
        ></a-mixin>
      </a-assets>

      <!-- ── Hiro Marker ── -->
      <a-marker preset="hiro" id="hiroMarker">

        <!-- Ground plane (visual reference) -->
        <a-plane
          id="groundPlane"
          rotation="-90 0 0"
          width="4" height="2"
          material="color: #1a1a2e; opacity: 0.45; transparent: true; side: double"
        ></a-plane>

        <!-- Grid lines on ground -->
        <a-entity id="gridLines"></a-entity>

        <!-- ── Cart group (moves along X) ── -->
        <a-entity id="cartGroup" position="0 0.2 0">

          <!-- Cart body -->
          <a-box
            id="cartBody"
            width="0.6" height="0.3" depth="0.35"
            material="color: #2196F3; metalness: 0.3; roughness: 0.6"
            position="0 0 0"
          ></a-box>

          <!-- Wheels -->
          <a-cylinder id="wheelFL" radius="0.07" height="0.05"
            rotation="90 0 0" position="-0.22 -0.12 0.18"
            material="color: #333; metalness: 0.5"></a-cylinder>
          <a-cylinder id="wheelFR" radius="0.07" height="0.05"
            rotation="90 0 0" position="-0.22 -0.12 -0.18"
            material="color: #333; metalness: 0.5"></a-cylinder>
          <a-cylinder id="wheelBL" radius="0.07" height="0.05"
            rotation="90 0 0" position="0.22 -0.12 0.18"
            material="color: #333; metalness: 0.5"></a-cylinder>
          <a-cylinder id="wheelBR" radius="0.07" height="0.05"
            rotation="90 0 0" position="0.22 -0.12 -0.18"
            material="color: #333; metalness: 0.5"></a-cylinder>

          <!-- Force arrow (shaft) -->
          <a-cylinder
            id="arrowShaft"
            radius="0.025" height="0.4"
            rotation="0 0 -90"
            position="0.5 0.05 0"
            material="color: #FF5722; emissive: #FF5722; emissiveIntensity: 0.4"
          ></a-cylinder>

          <!-- Force arrow (head) -->
          <a-cone
            id="arrowHead"
            radius-bottom="0.06" radius-top="0" height="0.12"
            rotation="0 0 -90"
            position="0.75 0.05 0"
            material="color: #FF5722; emissive: #FF5722; emissiveIntensity: 0.4"
          ></a-cone>

          <!-- 3D label above cart -->
          <a-text
            id="cartLabel"
            value="F=10N  m=2kg\na=5 m/s²"
            align="center"
            color="#FFFFFF"
            width="2"
            position="0 0.35 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
          ></a-text>

        </a-entity>
        <!-- /cartGroup -->

      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>

    </a-scene>
    <!-- /a-scene -->


    <!-- ═══════════════════════════════════════════
         HTML UI OVERLAY
    ════════════════════════════════════════════ -->
    <div id="ui-overlay">

      <!-- Top info bar -->
      <div id="info-bar">
        <span class="info-title">Newton's 2nd Law</span>
        <span class="info-formula">F = m × a</span>
      </div>

      <!-- Live readout cards -->
      <div id="readout-cards">
        <div class="card" id="card-force">
          <div class="card-value" id="display-force">10</div>
          <div class="card-unit">N</div>
          <div class="card-label">Force</div>
        </div>
        <div class="card card-accent" id="card-accel">
          <div class="card-value" id="display-accel">5.00</div>
          <div class="card-unit">m/s²</div>
          <div class="card-label">Acceleration</div>
        </div>
        <div class="card" id="card-mass">
          <div class="card-value" id="display-mass">2</div>
          <div class="card-unit">kg</div>
          <div class="card-label">Mass</div>
        </div>
      </div>

      <!-- Velocity readout -->
      <div id="velocity-bar">
        <span>Velocity: </span>
        <span id="display-velocity">0.00</span>
        <span> m/s</span>
        <span id="display-position" style="margin-left:16px">Pos: 0.00 m</span>
      </div>

      <!-- Controls panel -->
      <div id="controls-panel">

        <!-- Force slider -->
        <div class="slider-row">
          <label for="forceSlider">
            <span class="slider-icon">⚡</span> Force
            <span class="slider-val" id="forceVal">10 N</span>
          </label>
          <input type="range" id="forceSlider" min="1" max="20" value="10" step="1" />
        </div>

        <!-- Mass slider -->
        <div class="slider-row">
          <label for="massSlider">
            <span class="slider-icon">⚖️</span> Mass
            <span class="slider-val" id="massVal">2 kg</span>
          </label>
          <input type="range" id="massSlider" min="1" max="10" value="2" step="1" />
        </div>

        <!-- Action buttons -->
        <div id="btn-row">
          <button id="btnReset" class="btn btn-secondary">↺ Reset</button>
          <button id="btnPause" class="btn btn-primary">⏸ Pause</button>
        </div>

      </div>
      <!-- /controls-panel -->

      <!-- Marker hint -->
      <div id="marker-hint" class="hint-box">
        📷 Point camera at a <strong>Hiro marker</strong> to start
      </div>

    </div>
    <!-- /ui-overlay -->

    <script src="script.js"></script>
  </body>
</html>
